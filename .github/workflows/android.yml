name: Android verification

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'platform-tools'
      - name: Generate Room schemas via KSP & inspect identityHash
        run: |
          ./gradlew :app:kspClassicDebugKotlin --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
          grep -n '"identityHash"' app/schemas/sa.rihla.data.JourneyDatabase/8.json app/schemas/sa.rihla.audio.AudioDatabase/3.json
          python3 tools/verify_schema.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Unit tests, both editions
        run: ./gradlew :app:testClassicDebugUnitTest :app:testNextDebugUnitTest --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
      - name: Release lint, both editions
        run: ./gradlew :app:lintClassicRelease :app:lintNextRelease --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
      - name: Build both editions (Debug & Release)
        run: ./gradlew :app:assembleClassicDebug :app:assembleClassicRelease :app:assembleNextRelease --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
      - name: Test, lint, schema and APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: warn
          path: |
            android/app/schemas/**
            android/app/build/reports/tests/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-*
            android/app/build/outputs/apk/classic/release/app-classic-release.apk
