name: Android verification

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'platform-tools'
      - name: Generate Room schemas via KSP & inspect identityHash
        run: |
          ./gradlew :app:kspClassicDebugKotlin --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
          python3 - <<'PY'
          import json
          j8 = json.load(open("app/schemas/sa.rihla.data.JourneyDatabase/8.json"))["database"]["identityHash"]
          a3 = json.load(open("app/schemas/sa.rihla.audio.AudioDatabase/3.json"))["database"]["identityHash"]
          msg = f"JourneyDatabase_v8={j8} | AudioDatabase_v3={a3}"
          print(f"::notice title=SCHEMA_HASHES::{msg}")
          PY
          python3 tools/verify_schema.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Unit tests, both editions
        run: |
          set +e
          ./gradlew :app:testClassicDebugUnitTest :app:testNextDebugUnitTest --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' > /tmp/unit.log 2>&1
          rc=$?
          cat /tmp/unit.log
          if [ $rc -ne 0 ]; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines = open("/tmp/unit.log", errors="replace").read().splitlines()
          errs = [l for l in lines if l.startswith("e: ") or "FAILED" in l or "Exception" in l or "What went wrong" in l]
          xml_fails = []
          for p in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(p).getroot()
                  for tc in root.findall(".//testcase"):
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          txt = (f.text or f.attrib.get("message", ""))[:900]
                          xml_fails.append(f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}: {txt}")
              except Exception as ex:
                  xml_fails.append(f"XML parse {p}: {ex}")
          report = "\n".join((errs[:80] + ["--- XML FAILURES ---"] + xml_fails[:30]))[:9500]
          enc = report.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=UNIT_TEST_DIAGNOSTICS::{enc}")
          PY
            exit $rc
          fi
      - name: Release lint, both editions
        if: always()
        run: |
          set +e
          ./gradlew :app:lintClassicRelease :app:lintNextRelease --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' > /tmp/lint.log 2>&1
          rc=$?
          cat /tmp/lint.log
          if [ $rc -ne 0 ]; then
            python3 - <<'PY'
          import glob
          lines = open("/tmp/lint.log", errors="replace").read().splitlines()
          tail = "\n".join(lines[-80:])
          for p in sorted(glob.glob("app/build/reports/lint-results-*.txt")):
              txt = open(p, errors="replace").read()
              if "Error:" in txt:
                  tail += "\n--- " + p + " ---\n" + txt[:4000]
          enc = tail[-7500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=LINT_DIAGNOSTICS::{enc}")
          PY
            exit $rc
          fi
      - name: Build both editions (Debug & Release)
        if: always()
        run: |
          set +e
          ./gradlew :app:assembleClassicDebug :app:assembleClassicRelease :app:assembleNextRelease --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' > /tmp/build.log 2>&1
          rc=$?
          cat /tmp/build.log
          if [ $rc -ne 0 ]; then
            python3 - <<'PY'
          lines = open("/tmp/build.log", errors="replace").read().splitlines()
          enc = "\n".join(lines[-80:])[-7500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=BUILD_DIAGNOSTICS::{enc}")
          PY
            exit $rc
          fi
          ls -lh app/build/outputs/apk/classic/release/app-classic-release.apk app/build/outputs/apk/next/release/app-next-release.apk
      - name: Test, lint, schema and APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: warn
          path: |
            android/app/schemas/**
            android/app/build/reports/tests/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-*
            android/app/build/outputs/apk/classic/release/app-classic-release.apk
